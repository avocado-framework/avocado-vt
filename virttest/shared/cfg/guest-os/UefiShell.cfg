- @UefiShell:
    # Pseudo guest OS for tests that only drive the OVMF UEFI Shell and
    # never boot an installed OS, so they run once instead of once per
    # real guest OS. Select it with "only UefiShell".
    os_type = linux
    guest_name = UefiShell
    # no disk: the shell is reached straight from the firmware
    images =
    # the vars file is shared by every test of this guest OS; reset it
    # each run so one test's NVRAM state doesn't leak into the next
    restore_ovmf_vars = yes
    restore_aavmf_vars = yes
    # there is no OS running: nothing to log into and no dmesg to verify
    verify_guest_dmesg = no
    # the unresponsive VM check would just wait for a login that cannot
    # succeed, so skip it and destroy the VM directly instead
    kill_unresponsive_vms = no
    kill_vm = yes
